# Keeps the README's "verified" date current. This mirrors the same freshness
# stamp pattern used on rushabhshah.dev/linux-foundation-coupon/ — the date is
# only meaningful because it's genuinely automated, not manually edited.
name: Stamp verified date

on:
  schedule:
    - cron: "10 18 * * *" # daily at 23:40 IST (18:10 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-date
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: node scripts/update-verified-date.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing to update."
          else
            git commit -m "chore: stamp verified date"
            git push
          fi
