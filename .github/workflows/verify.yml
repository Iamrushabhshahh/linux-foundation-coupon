# Checks the README's pricing table against the live Linux Foundation
# certification pages, and only then stamps the "verified" date.
#
# A red run here means a price moved (or a page stopped resolving) and the
# README is now wrong — that's the alert. The date deliberately stays put on
# failure, so a stale-but-honest date is the worst case rather than a
# confidently wrong one.
name: Verify prices and stamp date

on:
  schedule:
    - cron: "10 18 * * *" # daily at 23:40 IST (18:10 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-date
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: node scripts/verify-prices.mjs

      - name: Commit if changed
        run: |
          # Authored as me rather than github-actions[bot]. The check runs on my
          # behalf and the README's "verified" claim is mine to stand behind, so
          # the commit log should say so. The email must be one attached to the
          # GitHub account or the commits show up as an unlinked stranger.
          git config user.name "Iamrushabhshahh"
          git config user.email "rushabhshah842@gmail.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing to update."
          else
            git commit -m "chore: verify prices, stamp date"
            git push
          fi
